let checkStatus = JSON.parse(localStorage.getItem("landCheck")||"{}");
const playerList = [];
rawText.split(/【\d+】/).filter(s=>s.trim()).forEach(block=>{
  const nameMatch = block.match(/名称：(.+?)\n/);
  const landMatch = block.match(/资源坐标：(.+?)$/s);
  if(!nameMatch||!landMatch) return;
  const name = nameMatch[1].trim();
  const lands = landMatch[1].split("、").map(x=>x.trim()).filter(x=>x);
  playerList.push({name,lands});
});
document.querySelector("#totalCnt").innerText = playerList.length;
const tagBox = document.querySelector("#tagBox");
playerList.forEach(p=>{
  const span = document.createElement("span");
  span.className = "player-tag";
  span.innerText = p.name;
  span.onclick=()=>{document.querySelector("#searchInput").value=p.name;doSearch();};
  tagBox.appendChild(span);
});

function refreshMarkCount(){
  let c=0;
  Object.values(checkStatus).forEach(v=>{if(v)c++;});
  document.querySelector("#markCount").innerText = c;
}

function doSearch(){
  const kw = document.querySelector("#searchInput").value.trim();
  const resultWrap = document.querySelector("#resultWrap");
  const copyArea = document.querySelector("#copyArea");
  copyArea.value="";
  resultWrap.innerHTML="";
  const find = playerList.find(x=>x.name.includes(kw));
  if(!find){
    resultWrap.innerText="未找到该玩家";
    return;
  }
  let outText = `玩家：${find.name}\n`;
  const divAll = document.createElement("div");
  find.lands.forEach(land=>{
    const key = find.name+"||"+land;
    const wrap = document.createElement("div");
    wrap.style="display:flex;gap:6px;align-items:center;margin:2px 0";
    const cb = document.createElement("input");
    cb.type="checkbox";
    cb.checked = !!checkStatus[key];
    cb.onchange=()=>{
      checkStatus[key]=cb.checked;
      localStorage.setItem("landCheck",JSON.stringify(checkStatus));
      refreshMarkCount();
    };
    const span = document.createElement("span");
    span.innerText=land;
    wrap.appendChild(cb);
    wrap.appendChild(span);
    divAll.appendChild(wrap);
    outText += land+"\n";
  });
  resultWrap.appendChild(divAll);
  copyArea.value = outText;
  refreshMarkCount();
}

document.querySelector("#searchBtn").onclick = doSearch;
document.querySelector("#searchInput").onkeydown=(e)=>{if(e.key==="Enter")doSearch();};
document.querySelector("#copyBtn").onclick=async ()=>{

  if(!ta.value){alert("没有可复制内容，请先查询");return;}
  await navigator.clipboard.writeText(ta.value);

};
